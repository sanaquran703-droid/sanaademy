services:
  - type: web
    name: sana-quran-academy
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && node .next/standalone/server.js
    healthCheckPath: /login
    envVars:
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: "201023290018"
